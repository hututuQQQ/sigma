packages:
  - "packages/*"
overrides:
  qs: 6.15.2
supportedArchitectures:
  os:
    - current
    - linux
    - win32
    - darwin
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
onlyBuiltDependencies:
  - esbuild
  - tree-sitter
  - tree-sitter-go
  - tree-sitter-javascript
  - tree-sitter-python
  - tree-sitter-rust
  - tree-sitter-typescript
allowBuilds:
  # Published Pi dependencies already include their generated runtime assets.
  # These install hooks are informational/no-op and are not required at runtime.
  '@google/genai': false
  esbuild: true
  protobufjs: false
  # The package's only install hook prints an OpenCollective message; OCR uses
  # its already-published JavaScript/WASM assets and needs no build step.
  tesseract.js: false
  tree-sitter: true
  tree-sitter-go: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
minimumReleaseAgeExclude:
  - '@earendil-works/pi-ai@0.84.0'
  - '@earendil-works/pi-telemetry@0.84.0'
patchedDependencies:
  '@earendil-works/pi-ai@0.84.0': patches/@earendil-works__pi-ai@0.84.0.patch
