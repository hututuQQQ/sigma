name: Release verification and publication

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NODE_VERSION: 26.4.0
  PNPM_VERSION: 11.7.0
  RUST_VERSION: 1.96.0
  RUST_COVERAGE_TOOLCHAIN: nightly-2026-07-01
  CARGO_LLVM_COV_VERSION: 0.8.6

jobs:
  metadata:
    name: Validate release identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      live_eval_override: ${{ steps.release.outputs.live_eval_override }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main or an exact version tag
        id: release
        shell: bash
        env:
          RELEASE_LIVE_EVAL_OVERRIDE_TAG: ${{ vars.RELEASE_LIVE_EVAL_OVERRIDE_TAG }}
          RELEASE_LIVE_EVAL_OVERRIDE_REASON: ${{ vars.RELEASE_LIVE_EVAL_OVERRIDE_REASON }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/u;
          if (!semver.test(version)) throw new Error(`package.json contains invalid SemVer: ${version}`);
          const expectedTag = `v${version}`;
          if (process.env.GITHUB_EVENT_NAME === "push" && process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} must exactly equal ${expectedTag}.`);
          }
          if (process.env.GITHUB_EVENT_NAME === "workflow_dispatch" && process.env.GITHUB_REF !== "refs/heads/main") {
            throw new Error("Manual release verification must run from main.");
          }
          const overrideTag = (process.env.RELEASE_LIVE_EVAL_OVERRIDE_TAG ?? "").trim();
          const overrideReason = (process.env.RELEASE_LIVE_EVAL_OVERRIDE_REASON ?? "").trim();
          if (overrideTag && overrideTag !== expectedTag) {
            throw new Error(`Live-evaluation override tag ${overrideTag} must equal ${expectedTag}.`);
          }
          if (overrideTag && !overrideReason) {
            throw new Error("RELEASE_LIVE_EVAL_OVERRIDE_REASON is required when an override tag is configured.");
          }
          const liveEvalOverride = process.env.GITHUB_EVENT_NAME === "push"
            && process.env.GITHUB_REF_NAME === overrideTag;
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${version}\nprerelease=${version.includes("-")}\nlive_eval_override=${liveEvalOverride}\n`
          );
          NODE
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git fetch origin main --no-tags
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
              echo "Release tags must point to a commit reachable from main." >&2
              exit 1
            }
          fi

  verify:
    name: ${{ matrix.label }} ${{ matrix.channel }} verification
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
            release: linux
            channel: stable release
          - os: windows-2022
            label: win32-x64
            release: windows
            channel: unsigned preview
    runs-on: ${{ matrix.os }}
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure canonical runner temp directory
        if: runner.os == 'Windows'
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned pnpm (Linux)
        shell: bash
        if: runner.os != 'Windows'
        run: npm install --global "pnpm@${PNPM_VERSION}" && test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Install pinned pnpm (Windows)
        if: runner.os == 'Windows'
        run: |
          npm install --global "pnpm@$env:PNPM_VERSION"
          if ((pnpm --version).Trim() -ne $env:PNPM_VERSION) { throw "Unexpected pnpm version: $(pnpm --version)" }
      - name: Install pinned Rust and coverage toolchain
        shell: bash
        if: runner.os != 'Windows'
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component llvm-tools-preview
          rustup default "${RUST_VERSION}"
          rustup toolchain install "${RUST_COVERAGE_TOOLCHAIN}" --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --version "${CARGO_LLVM_COV_VERSION}" --locked
      - name: Install pinned Rust and coverage toolchain
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component llvm-tools-preview
          rustup default $env:RUST_VERSION
          rustup toolchain install $env:RUST_COVERAGE_TOOLCHAIN --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --version $env:CARGO_LLVM_COV_VERSION --locked
      - name: Prepare Linux sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Install Windows ConPTY dependency
        if: runner.os == 'Windows'
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/ci/windows-pty-requirements.txt"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Configure release provenance trust (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_PROVENANCE_PRIVATE_KEY_PEM: ${{ secrets.AGENT_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
          RELEASE_PROVENANCE_PUBLIC_KEY_PEM: ${{ secrets.AGENT_RELEASE_TRUSTED_PUBLIC_KEY_PEM }}
        run: |
          if [[ -z "${RELEASE_PROVENANCE_PRIVATE_KEY_PEM}" || -z "${RELEASE_PROVENANCE_PUBLIC_KEY_PEM}" ]]; then
            echo "AGENT_RELEASE_SIGNING_PRIVATE_KEY_PEM and AGENT_RELEASE_TRUSTED_PUBLIC_KEY_PEM secrets are required." >&2
            exit 1
          fi
          umask 077
          private_key="${RUNNER_TEMP}/release-provenance-private.pem"
          public_key="${RUNNER_TEMP}/release-provenance-public.pem"
          printf '%s' "${RELEASE_PROVENANCE_PRIVATE_KEY_PEM}" > "${private_key}"
          printf '%s' "${RELEASE_PROVENANCE_PUBLIC_KEY_PEM}" > "${public_key}"
          echo "AGENT_RELEASE_SIGNING_PRIVATE_KEY_FILE=${private_key}" >> "${GITHUB_ENV}"
          echo "AGENT_RELEASE_TRUSTED_PUBLIC_KEY_FILES=${public_key}" >> "${GITHUB_ENV}"
      - name: Configure release provenance trust (Windows)
        if: runner.os == 'Windows'
        env:
          RELEASE_PROVENANCE_PRIVATE_KEY_PEM: ${{ secrets.AGENT_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
          RELEASE_PROVENANCE_PUBLIC_KEY_PEM: ${{ secrets.AGENT_RELEASE_TRUSTED_PUBLIC_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_PROVENANCE_PRIVATE_KEY_PEM) -or
              [string]::IsNullOrWhiteSpace($env:RELEASE_PROVENANCE_PUBLIC_KEY_PEM)) {
            throw "AGENT_RELEASE_SIGNING_PRIVATE_KEY_PEM and AGENT_RELEASE_TRUSTED_PUBLIC_KEY_PEM secrets are required."
          }
          $privateKey = Join-Path $env:RUNNER_TEMP "release-provenance-private.pem"
          $publicKey = Join-Path $env:RUNNER_TEMP "release-provenance-public.pem"
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($privateKey, $env:RELEASE_PROVENANCE_PRIVATE_KEY_PEM, $utf8)
          [System.IO.File]::WriteAllText($publicKey, $env:RELEASE_PROVENANCE_PUBLIC_KEY_PEM, $utf8)
          "AGENT_RELEASE_SIGNING_PRIVATE_KEY_FILE=$privateKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGENT_RELEASE_TRUSTED_PUBLIC_KEY_FILES=$publicKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify release target
        run: pnpm verify:release:${{ matrix.release }}
      - name: Stage public provenance key
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .artifacts
          cp -- "${AGENT_RELEASE_TRUSTED_PUBLIC_KEY_FILES}" .artifacts/release-provenance-public.pem
          chmod 0644 .artifacts/release-provenance-public.pem
      - name: Remove release signing material (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          for file in "${AGENT_RELEASE_SIGNING_PRIVATE_KEY_FILE:-}" "${AGENT_RELEASE_TRUSTED_PUBLIC_KEY_FILES:-}"; do
            if [[ -n "${file}" ]]; then rm -f -- "${file}"; fi
          done
      - name: Remove release signing material (Windows)
        if: always() && runner.os == 'Windows'
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:AGENT_RELEASE_SIGNING_PRIVATE_KEY_FILE)) {
            Remove-Item -LiteralPath $env:AGENT_RELEASE_SIGNING_PRIVATE_KEY_FILE -Force -ErrorAction SilentlyContinue
          }
          if (-not [string]::IsNullOrWhiteSpace($env:AGENT_RELEASE_TRUSTED_PUBLIC_KEY_FILES)) {
            Remove-Item -LiteralPath $env:AGENT_RELEASE_TRUSTED_PUBLIC_KEY_FILES -Force -ErrorAction SilentlyContinue
          }
      - name: Require all five live scenarios and zero safety failures
        if: needs.metadata.outputs.live_eval_override != 'true'
        run: pnpm eval:agent -- --suite quick --repeat 1 --skip-package --eval-root .artifacts/eval-rc
      - name: Record authorized live-evaluation override
        if: needs.metadata.outputs.live_eval_override == 'true' && runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_LIVE_EVAL_OVERRIDE_REASON: ${{ vars.RELEASE_LIVE_EVAL_OVERRIDE_REASON }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";

          const reason = (process.env.RELEASE_LIVE_EVAL_OVERRIDE_REASON ?? "").trim();
          if (!reason) throw new Error("Live-evaluation override reason is missing.");
          mkdirSync(".artifacts", { recursive: true });
          const record = {
            schemaVersion: 1,
            kind: "sigma.release-live-evaluation-override",
            tag: process.env.GITHUB_REF_NAME,
            version: process.env.RELEASE_VERSION,
            commit: process.env.GITHUB_SHA,
            reason,
            authorizedBy: process.env.GITHUB_ACTOR,
            recordedAt: new Date().toISOString()
          };
          writeFileSync(
            ".artifacts/release-live-evaluation-override.json",
            `${JSON.stringify(record, null, 2)}\n`
          );
          NODE
      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            .artifacts/agent-cli-${{ matrix.label }}.${{ matrix.release == 'windows' && 'zip' || 'tgz' }}
            .artifacts/agent-cli-${{ matrix.label }}.${{ matrix.release == 'windows' && 'zip' || 'tgz' }}.sha256
            .artifacts/agent-cli-${{ matrix.label }}.sbom.cdx.json
            .artifacts/agent-cli-${{ matrix.label }}.provenance.json
      - name: Upload public provenance key
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-public-key-${{ github.run_id }}
          if-no-files-found: error
          path: .artifacts/release-provenance-public.pem
      - name: Upload live-evaluation override record
        if: needs.metadata.outputs.live_eval_override == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-live-eval-override-${{ github.run_id }}
          if-no-files-found: error
          path: .artifacts/release-live-evaluation-override.json
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-${{ matrix.label }}-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .artifacts/**

  desktop:
    name: Build Sigma Code Windows x64 installer
    needs: [metadata, verify]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout matching Sigma Code source
        uses: actions/checkout@v4
        with:
          repository: hututuQQQ/sigma-code
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
          path: sigma-code
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm
          cache-dependency-path: sigma-code/pnpm-lock.yaml
      - name: Download verified Windows Runtime
        uses: actions/download-artifact@v4
        with:
          name: release-win32-x64-${{ github.run_id }}
          path: runtime-assets
      - name: Verify and extract matching Runtime
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "runtime-assets/agent-cli-win32-x64.zip"
          $sidecar = "$archive.sha256"
          $expectedHash = ((Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Sigma Runtime checksum mismatch." }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "runtime-assets")
          $metadataPath = Join-Path $env:GITHUB_WORKSPACE "runtime-assets/agent-cli-win32-x64/package-metadata.json"
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ($metadata.productVersion -ne $env:RELEASE_VERSION) {
            throw "Runtime version $($metadata.productVersion) does not match $env:RELEASE_VERSION."
          }
      - name: Require matching Sigma Code version
        working-directory: sigma-code
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          foreach ($manifest in @(
            "apps/server/package.json",
            "apps/desktop/package.json",
            "apps/web/package.json",
            "packages/contracts/package.json"
          )) {
            $version = (Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json).version
            if ($version -ne $env:RELEASE_VERSION) {
              throw "$manifest version $version does not match $env:RELEASE_VERSION."
            }
          }
      - name: Install Sigma Code workspace
        working-directory: sigma-code
        run: pnpm install --frozen-lockfile
      - name: Build unsigned installer with bundled Runtime
        working-directory: sigma-code
        env:
          SIGMACODE_DESKTOP_SIGMA_RUNTIME: ${{ github.workspace }}\runtime-assets\agent-cli-win32-x64
          SIGMACODE_DESKTOP_OUTPUT_DIR: ${{ github.workspace }}\desktop-assets
          SIGMACODE_DESKTOP_VERSION: ${{ needs.metadata.outputs.version }}
          SIGMACODE_DESKTOP_UPDATE_REPOSITORY: hututuQQQ/sigma
        run: pnpm run dist:desktop:win:x64
      - name: Verify installer asset set
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $assetRoot = Join-Path $env:GITHUB_WORKSPACE "desktop-assets"
          $installer = Join-Path $assetRoot "Sigma-Code-$env:RELEASE_VERSION-x64.exe"
          $blockmap = "$installer.blockmap"
          $updateManifest = Join-Path $assetRoot "latest.yml"
          foreach ($asset in @($installer, $blockmap, $updateManifest)) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing Sigma Code release asset: $asset"
            }
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "NotSigned") {
            throw "Expected an unsigned preview installer, got Authenticode status $($signature.Status)."
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  $([IO.Path]::GetFileName($installer))`n"
          [IO.File]::WriteAllText("$installer.sha256", $line, [Text.UTF8Encoding]::new($false))
      - name: Upload verified desktop assets
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-win32-x64-${{ github.run_id }}
          if-no-files-found: error
          path: |
            desktop-assets/Sigma-Code-${{ needs.metadata.outputs.version }}-x64.exe
            desktop-assets/Sigma-Code-${{ needs.metadata.outputs.version }}-x64.exe.sha256
            desktop-assets/Sigma-Code-${{ needs.metadata.outputs.version }}-x64.exe.blockmap
            desktop-assets/latest.yml

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [metadata, verify, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ github.run_id }}
          path: release-assets
          merge-multiple: true
      - name: Require the complete release asset set
        shell: bash
        env:
          RELEASE_LIVE_EVAL_OVERRIDE: ${{ needs.metadata.outputs.live_eval_override }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync } from "node:fs";

          const expected = [
            "agent-cli-linux-x64.tgz",
            "agent-cli-linux-x64.tgz.sha256",
            "agent-cli-linux-x64.sbom.cdx.json",
            "agent-cli-linux-x64.provenance.json",
            "agent-cli-win32-x64.zip",
            "agent-cli-win32-x64.zip.sha256",
            "agent-cli-win32-x64.sbom.cdx.json",
            "agent-cli-win32-x64.provenance.json",
            "release-provenance-public.pem",
            `Sigma-Code-${process.env.RELEASE_VERSION}-x64.exe`,
            `Sigma-Code-${process.env.RELEASE_VERSION}-x64.exe.sha256`,
            `Sigma-Code-${process.env.RELEASE_VERSION}-x64.exe.blockmap`,
            "latest.yml"
          ];
          if (process.env.RELEASE_LIVE_EVAL_OVERRIDE === "true") {
            expected.push("release-live-evaluation-override.json");
          }
          const actual = new Set(readdirSync("release-assets"));
          const missing = expected.filter((name) => !actual.has(name));
          if (missing.length > 0) throw new Error(`Missing release assets: ${missing.join(", ")}`);
          NODE
      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          RELEASE_LIVE_EVAL_OVERRIDE: ${{ needs.metadata.outputs.live_eval_override }}
          RELEASE_LIVE_EVAL_OVERRIDE_REASON: ${{ vars.RELEASE_LIVE_EVAL_OVERRIDE_REASON }}
        run: |
          options=(--verify-tag --generate-notes --title "Sigma Code ${GITHUB_REF_NAME}")
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            options+=(--prerelease)
          else
            options+=(--latest)
          fi
          release_notes="$(cat <<'EOF'
          ## Platform status

          - **Linux x64:** stable release. The archive passed the complete release-readiness gate.
          - **Windows x64:** **unsigned preview**. The archive passed package, sandbox, live-product, checksum, SBOM, and signed-provenance verification, but its executables do not have a trusted Authenticode signature. Windows SmartScreen or Smart App Control may warn or block execution.
          - **Sigma Code Windows x64 installer:** **unsigned preview** containing both the desktop UI and the verified Sigma Runtime from this release. Install it to use Sigma Code without separately installing Node.js or the agent CLI. The matching blockmap and update manifest enable Sigma-owned desktop updates.

          Verify the matching SHA-256 sidecar before running the installer. Verify the archive sidecars and signed provenance before extracting either Runtime archive. Windows assets are not trusted signed Windows binaries.
          EOF
          )"
          if [[ "${RELEASE_LIVE_EVAL_OVERRIDE}" == "true" ]]; then
            release_notes="${release_notes}

          ## Live evaluation exception

          The quick-five live evaluation gate was explicitly skipped for this tag: ${RELEASE_LIVE_EVAL_OVERRIDE_REASON}

          All deterministic platform, security, live-provider, package, checksum, SBOM, and signed-provenance gates still passed. See \`release-live-evaluation-override.json\` for the audit record."
          fi
          assets=(
            "release-assets/agent-cli-linux-x64.tgz#Linux x64 — stable"
            "release-assets/agent-cli-linux-x64.tgz.sha256"
            "release-assets/agent-cli-linux-x64.sbom.cdx.json"
            "release-assets/agent-cli-linux-x64.provenance.json"
            "release-assets/agent-cli-win32-x64.zip#Windows x64 Runtime — UNSIGNED PREVIEW"
            "release-assets/agent-cli-win32-x64.zip.sha256"
            "release-assets/agent-cli-win32-x64.sbom.cdx.json"
            "release-assets/agent-cli-win32-x64.provenance.json"
            "release-assets/release-provenance-public.pem"
            "release-assets/Sigma-Code-${RELEASE_VERSION}-x64.exe#Sigma Code Windows x64 installer — UI + Runtime (UNSIGNED PREVIEW)"
            "release-assets/Sigma-Code-${RELEASE_VERSION}-x64.exe.sha256"
            "release-assets/Sigma-Code-${RELEASE_VERSION}-x64.exe.blockmap"
            "release-assets/latest.yml"
          )
          if [[ "${RELEASE_LIVE_EVAL_OVERRIDE}" == "true" ]]; then
            assets+=("release-assets/release-live-evaluation-override.json")
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" --notes "${release_notes}" "${options[@]}"
